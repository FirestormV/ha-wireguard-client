configuration:
  site_to_site:
    name: "Site-to-site-gateway"
    description: "Tillåt IPv4-anslutningar från VPN till lokala nät via begränsad NAT. Behåller isoleringen från hostens nätverk. Kräver befintlig IPv4-forwarding i containern."
  local_networks:
    name: "Lokala LAN-destinationer"
    description: "Explicita IPv4-nät som nås från HA-sidan, t.ex. 192.168.1.0/24. Krävs när gateway är aktiverad. Får inte överlappa nät via pfSense eller interna containernät."
  private_key:
    name: "Klientens privata nyckel"
    description: "Lämna tom för att automatiskt skapa och återanvända en sparad klientnyckel. Klistra valfritt in en egen privat nyckel för att importera den. Dela aldrig nyckeln."
  peer_public_key:
    name: "pfSense publika nyckel"
    description: "Den publika nyckeln för pfSense-tunneln, inte klientens publika nyckel."
  preshared_key:
    name: "Delad nyckel (valfri)"
    description: "En extra delad hemlig nyckel. Måste matcha pfSense. Lämna tom för att avaktivera."
  endpoint_host:
    name: "pfSense endpoint-adress"
    description: "Publik IPv4-adress eller DNS-namn för pfSense. Ange porten i det separata fältet."
  endpoint_port:
    name: "pfSense UDP-port"
    description: "Porten där pfSense lyssnar på WireGuard. Standard: 51820."
  tunnel_address:
    name: "Klientens tunneladress"
    description: "Tilläggets IPv4-adress i tunneln med /32-prefix. Exempel: 10.77.0.2/32."
  allowed_ips:
    name: "Nät via pfSense"
    description: "Ange pfSense tunnel-IP och hemnäten för returtrafik. Ange inte fjärr-LAN eller en default route."
  persistent_keepalive:
    name: "Persistent keepalive (sekunder)"
    description: "Intervall från 0 till 65535 sekunder. Standard: 25 för CGNAT. Ange 0 för att stänga av."
  mtu:
    name: "Tunnelns MTU"
    description: "Maximal paketstorlek i tunneln, 1280–1420 byte. Standard: 1380. Prova 1280 om stora överföringar fastnar."
  homeassistant_host:
    name: "Home Assistant-m\u00e5l"
    description: "IPv4-adress eller värdnamn för HA Core som kan nås från tillägget. Standard: homeassistant."
  homeassistant_port:
    name: "Home Assistant-m\u00e5l TCP port"
    description: "TCP-port för HA Core. Standard: 8123. Porten på tunnelsidan är alltid 8123."
