name: WireGuard Client
version: "0.1.4"
slug: wireguard_client
url: https://github.com/FirestormV/ha-wireguard-client
description: Outbound WireGuard tunnel to pfSense with routed access to Home Assistant
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: true
host_network: true
ingress: true
ingress_port: 0
panel_icon: mdi:key
panel_admin: true
hassio_api: true
privileged:
  - NET_ADMIN
apparmor: false
tmpfs: true
timeout: 30
stage: experimental
options:
  private_key: ""
  peer_public_key: ""
  preshared_key: ""
  endpoint_host: "vpn.example.com"
  endpoint_port: 51820
  tunnel_address: "10.77.0.2/32"
  allowed_ips:
    - "10.77.0.1/32"
    - "192.168.10.0/24"
  persistent_keepalive: 25
  mtu: 1380
schema:
  private_key: password
  peer_public_key: str
  preshared_key: password
  endpoint_host: str
  endpoint_port: port
  tunnel_address: str
  allowed_ips:
    - str
  persistent_keepalive: "int(0,65535)"
  mtu: "int(1280,1420)"
